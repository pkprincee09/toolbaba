<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Page Not Found | Toolbaba</title>

<meta name="robots" content="noindex">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  background:#f6f8fc;
  color:#17243a;
  display:flex;
  flex-direction:column;
}

header{
  height:72px;
  background:#fff;
  border-bottom:1px solid #e6eaf1;
  display:flex;
  align-items:center;
  padding:0 6%;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:-1.3px;
  color:#0b1b35;
  text-decoration:none;
}

.logo span{
  color:#0759d8;
}

main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:50px 20px;
}

.box{
  width:min(650px,100%);
  background:#fff;
  border:1px solid #e6eaf1;
  border-radius:24px;
  padding:55px 30px;
  text-align:center;
  box-shadow:0 12px 40px rgba(11,27,53,.06);
}

.number{
  font-size:clamp(75px,15vw,125px);
  line-height:1;
  font-weight:900;
  letter-spacing:-7px;
  color:#0759d8;
  margin-bottom:15px;
}

h1{
  font-size:30px;
  letter-spacing:-1px;
  margin-bottom:12px;
}

p{
  color:#69778d;
  font-size:15px;
  max-width:480px;
  margin:0 auto 27px;
  line-height:1.7;
}

.btn{
  display:inline-block;
  background:#0759d8;
  color:#fff;
  text-decoration:none;
  padding:13px 22px;
  border-radius:11px;
  font-size:14px;
  font-weight:800;
}

.btn:hover{
  opacity:.9;
}

footer{
  background:#081a35;
  color:#9eb0ca;
  padding:35px 20px;
  text-align:center;
}

.footer-logo{
  color:#fff;
  font-size:23px;
  font-weight:900;
  margin-bottom:8px;
}

.footer-logo span{
  color:#4f9cff;
}

footer p{
  margin:0;
  color:#9eb0ca;
  font-size:12px;
}

@media(max-width:600px){

  header{
    padding:0 20px;
  }

  .box{
    padding:45px 22px;
    border-radius:20px;
  }

  h1{
    font-size:26px;
  }

}

</style>

</head>

<body>

<header>

  <a href="index.html" class="logo">
    Tool<span>baba</span>
  </a>

</header>


<main>

  <div class="box">

    <div class="number">
      404
    </div>

    <h1>
      Oops! Page Not Found
    </h1>

    <p>
      The page you're looking for may have been moved,
      deleted, or the address may be incorrect.
      Let's get you back to Toolbaba.
    </p>

    <a href="index.html" class="btn">
      ← Back to Toolbaba
    </a>

  </div>

</main>


<footer>

  <div class="footer-logo">
    Tool<span>baba</span>
  </div>

  <p>
    Simple tools. Quick answers.
  </p>

</footer>

</body>
</html>
